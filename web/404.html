<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var m=document.cookie.match(/(?:^|; )theme=([^;]*)/);var t=m?decodeURIComponent(m[1]):null;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>Stranica ne postoji — NajavaRadova.rs</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101013'/%3E%3Crect x='27' y='13' width='10' height='27' rx='5' fill='%23F2F0EE'/%3E%3Ccircle cx='32' cy='48' r='6' fill='%235FAEE3'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #101013; --text: #F2F0EE; --dim: #A5A1AB; --mute: #8C8892;
    --link: #7FA9F5; --link-hi: #B3CBFA; --panel-border: #24242A;
    --sel-bg: #17171B; --btn-hover: #fff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light; }
    :root:not([data-theme="dark"]) {
      --bg: #EFEBE2; --text: #2A2620; --dim: #6E6858; --mute: #8B8471;
      --link: #3763B0; --link-hi: #2A4F8C; --panel-border: #DCD4C3;
      --sel-bg: #E6DFCE; --btn-hover: #3d372c;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #EFEBE2; --text: #2A2620; --dim: #6E6858; --mute: #8B8471;
    --link: #3763B0; --link-hi: #2A4F8C; --panel-border: #DCD4C3;
    --sel-bg: #E6DFCE; --btn-hover: #3d372c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .theme-toggle {
    display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 20px;
    background: var(--sel-bg); border: 1px solid var(--panel-border);
    position: fixed; top: 16px; right: 16px;
  }
  .theme-toggle button {
    all: unset; width: 26px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 16px; font-size: 12.5px; line-height: 1; cursor: pointer; color: var(--mute);
  }
  .theme-toggle button.on { background: var(--bg); color: var(--text); }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .mark { border-radius: 5px; margin-bottom: 26px; }
  .code { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--mute); margin-bottom: 14px; }
  h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.03em; margin-bottom: 12px; text-wrap: balance; }
  p { font-size: 16px; color: var(--dim); line-height: 1.55; max-width: 34em; margin-bottom: 30px; }
  a.home {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 9px;
    background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 600; text-decoration: none;
    transition: background .18s ease, transform .18s ease;
  }
  a.home:hover { background: var(--btn-hover); transform: translateY(-1px); }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 18px; text-align: center; font-size: 13px; color: var(--mute); border-top: 1px solid var(--panel-border); }
  footer a { color: var(--mute); }
  footer a:hover { color: var(--dim); }
</style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" role="group" aria-label="Izgled stranice">
    <button type="button" data-theme-choice="system" title="Sistem" aria-label="Sistem">🖥</button>
    <button type="button" data-theme-choice="dark" title="Tamna tema" aria-label="Tamna tema">🌙</button>
    <button type="button" data-theme-choice="light" title="Svetla tema" aria-label="Svetla tema">☀️</button>
  </div>
  <svg class="mark" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#101013"/>
    <rect x="27" y="13" width="10" height="27" rx="5" fill="#F2F0EE"/>
    <circle cx="32" cy="48" r="6" fill="#5FAEE3"/>
  </svg>
  <div class="code">404</div>
  <h1>Ova stranica ne postoji.</h1>
  <p>Link je možda zastareo ili je adresa pogrešno ukucana. Mapa i sve aktivne najave isključenja i dalje rade na početnoj strani.</p>
  <a class="home" href="https://najavaradova.rs/">← Nazad na NajavaRadova.rs</a>
  <footer><a href="mailto:obavestenja@najavaradova.rs">obavestenja@najavaradova.rs</a></footer>
<script>
(function () {
  var THEME_COOKIE = "theme";
  var THEME_COOKIE_DOMAIN = "najavaradova.rs";
  function storedTheme() {
    try {
      var m = document.cookie.match(/(?:^|; )theme=([^;]*)/);
      var t = m ? decodeURIComponent(m[1]) : null;
      return (t === "light" || t === "dark") ? t : null;
    } catch (e) { return null; }
  }
  function updateUI() {
    var choice = storedTheme() || "system";
    var btns = document.querySelectorAll("#themeToggle button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("on", btns[i].dataset.themeChoice === choice);
  }
  function setTheme(choice) {
    try {
      var attrs = "; domain=" + THEME_COOKIE_DOMAIN + "; path=/; samesite=lax; secure";
      if (choice === "system") document.cookie = THEME_COOKIE + "=; max-age=0" + attrs;
      else document.cookie = THEME_COOKIE + "=" + encodeURIComponent(choice) + "; max-age=31536000" + attrs;
    } catch (e) {}
    if (choice === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", choice);
    updateUI();
  }
  var btns = document.querySelectorAll("#themeToggle button");
  for (var i = 0; i < btns.length; i++) btns[i].onclick = function () { setTheme(this.dataset.themeChoice); };
  updateUI();
})();
</script>
</body>
</html>
