<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .n{fill:#161b22;stroke:#30363d;stroke-width:1.2}
      .t{font-size:13px;font-weight:600;fill:#e6edf3;text-anchor:middle}
      .s{font-size:11px;fill:#8b949e;text-anchor:middle}
      .g{font-size:10.5px;font-weight:700;letter-spacing:1.2px}
      .e{fill:none;stroke:#8b949e;stroke-width:1.5}
      .d{stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="960" height="720" rx="14" fill="#0d1117"/>

  <!-- title + legend -->
  <text x="28" y="40" font-size="16" font-weight="700" fill="#e6edf3">NajavaRadova.rs · system architecture</text>
  <g font-size="11" fill="#8b949e">
    <rect x="560" y="30" width="11" height="11" rx="2" fill="#a371f7"/><text x="577" y="40">AI</text>
    <rect x="610" y="30" width="11" height="11" rx="2" fill="#3fb950"/><text x="627" y="40">Geo</text>
    <rect x="667" y="30" width="11" height="11" rx="2" fill="#d29922"/><text x="684" y="40">Storage</text>
    <rect x="745" y="30" width="11" height="11" rx="2" fill="#f0883e"/><text x="762" y="40">Cloudflare</text>
    <rect x="840" y="30" width="11" height="11" rx="2" fill="#58a6ff"/><text x="857" y="40">Outside</text>
  </g>

  <!-- Oracle VM -->
  <rect x="220" y="70" width="500" height="625" rx="12" fill="#58a6ff" fill-opacity=".04" stroke="#58a6ff" stroke-opacity=".55" stroke-dasharray="6 4"/>
  <text x="236" y="94" class="g" fill="#58a6ff">ORACLE CLOUD VM · DOCKER COMPOSE</text>

  <!-- pipeline column -->
  <rect x="245" y="110" width="220" height="46" rx="8" class="n"/>
  <text x="355" y="130" class="t">Scrapers</text>
  <text x="355" y="146" class="s">22 sources · every 15 min</text>
  <line x1="355" y1="156" x2="355" y2="180" class="e" marker-end="url(#a)"/>

  <rect x="245" y="182" width="220" height="196" rx="10" fill="#a371f7" fill-opacity=".08" stroke="#a371f7" stroke-opacity=".6"/>
  <text x="257" y="200" class="g" fill="#a371f7">AI LAYER</text>
  <rect x="260" y="210" width="190" height="46" rx="8" class="n" style="stroke:#a371f7"/>
  <text x="355" y="230" class="t">LLM parser</text>
  <text x="355" y="246" class="s">Gemini · strict JSON schema</text>
  <line x1="355" y1="256" x2="355" y2="266" class="e" marker-end="url(#a)"/>
  <rect x="260" y="268" width="190" height="38" rx="8" class="n" style="stroke:#a371f7"/>
  <text x="355" y="292" class="t">Validation rules</text>
  <line x1="355" y1="306" x2="355" y2="316" class="e" marker-end="url(#a)"/>
  <rect x="260" y="318" width="190" height="48" rx="8" class="n d" style="stroke:#a371f7"/>
  <text x="355" y="338" class="t">Second-model check</text>
  <text x="355" y="354" class="s">risky readings only</text>
  <line x1="355" y1="378" x2="355" y2="398" class="e" marker-end="url(#a)"/>

  <rect x="245" y="400" width="220" height="135" rx="10" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="257" y="418" class="g" fill="#3fb950">GEO LAYER</text>
  <rect x="260" y="426" width="190" height="44" rx="8" class="n" style="stroke:#3fb950"/>
  <text x="355" y="445" class="t">RGZ address registry</text>
  <text x="355" y="461" class="s">+ OpenStreetMap</text>
  <line x1="355" y1="470" x2="355" y2="478" class="e" marker-end="url(#a)"/>
  <rect x="260" y="480" width="190" height="44" rx="8" class="n" style="stroke:#3fb950"/>
  <text x="355" y="499" class="t">H3 hexagons</text>
  <text x="355" y="515" class="s">house-number ranges</text>
  <line x1="355" y1="535" x2="355" y2="555" class="e" marker-end="url(#a)"/>

  <rect x="245" y="557" width="220" height="46" rx="8" class="n"/>
  <text x="355" y="577" class="t">Matcher</text>
  <text x="355" y="593" class="s">street + house number</text>
  <line x1="465" y1="580" x2="493" y2="580" class="e" marker-end="url(#a)"/>

  <!-- service column -->
  <rect x="495" y="110" width="205" height="40" rx="8" class="n"/>
  <text x="597" y="135" class="t">Caddy · TLS</text>
  <line x1="597" y1="150" x2="597" y2="163" class="e" marker-end="url(#a)"/>
  <rect x="495" y="165" width="205" height="46" rx="8" class="n"/>
  <text x="597" y="185" class="t">API + dashboard</text>
  <text x="597" y="201" class="s">magic-link login · signups</text>
  <line x1="530" y1="211" x2="530" y2="541" class="e" marker-end="url(#a)"/>

  <rect x="565" y="380" width="135" height="46" rx="8" class="n"/>
  <text x="632" y="400" class="t">Watchdog</text>
  <text x="632" y="416" class="s">checks every 5 min</text>
  <line x1="632" y1="426" x2="632" y2="541" class="e d"/>

  <path d="M495,555 v50 a102.5,12 0 0 0 205,0 v-50" fill="#d29922" fill-opacity=".1" stroke="#d29922"/>
  <ellipse cx="597.5" cy="555" rx="102.5" ry="12" fill="#1c1a12" stroke="#d29922"/>
  <text x="597" y="588" class="t">SQLite</text>
  <text x="597" y="604" class="s">outages · addresses · queue</text>

  <line x1="544" y1="617" x2="544" y2="633" class="e" marker-end="url(#a)"/>
  <line x1="651" y1="617" x2="651" y2="633" class="e" marker-end="url(#a)"/>
  <rect x="495" y="635" width="98" height="40" rx="8" class="n"/>
  <text x="544" y="660" class="t">Telegram</text>
  <rect x="602" y="635" width="98" height="40" rx="8" class="n"/>
  <text x="651" y="653" class="t">Email</text>
  <text x="651" y="668" class="s">Brevo SMTP</text>

  <!-- left: sources + CI -->
  <rect x="25" y="105" width="170" height="56" rx="8" class="n" style="stroke:#58a6ff"/>
  <text x="110" y="128" class="t">22 utility websites</text>
  <text x="110" y="145" class="s">power · water · heating</text>
  <line x1="195" y1="133" x2="243" y2="133" class="e" marker-end="url(#a)"/>

  <rect x="25" y="560" width="170" height="70" rx="8" class="n" style="stroke:#58a6ff"/>
  <text x="110" y="583" class="t">GitHub Actions</text>
  <text x="110" y="600" class="s">tests on every PR</text>
  <text x="110" y="616" class="s">SSH deploy on merge</text>
  <line x1="195" y1="595" x2="218" y2="595" class="e" marker-end="url(#a)"/>

  <!-- right: Cloudflare -->
  <rect x="745" y="70" width="190" height="250" rx="12" fill="#f0883e" fill-opacity=".06" stroke="#f0883e" stroke-opacity=".6"/>
  <text x="757" y="94" class="g" fill="#f0883e">CLOUDFLARE</text>
  <rect x="760" y="105" width="160" height="46" rx="8" class="n" style="stroke:#f0883e"/>
  <text x="840" y="125" class="t">Pages</text>
  <text x="840" y="141" class="s">site · map · city pages</text>
  <line x1="840" y1="151" x2="840" y2="163" class="e" marker-end="url(#a)"/>
  <rect x="760" y="165" width="160" height="46" rx="8" class="n" style="stroke:#f0883e"/>
  <text x="840" y="185" class="t">Worker + KV</text>
  <text x="840" y="201" class="s">live map data API</text>
  <rect x="760" y="255" width="160" height="50" rx="8" class="n" style="stroke:#d29922"/>
  <text x="840" y="276" class="t">R2</text>
  <text x="840" y="292" class="s">nightly DB backups</text>

  <path d="M700,568 H722 V188 H758" class="e" marker-end="url(#a)"/>
  <path d="M700,592 H735 V280 H758" class="e d" marker-end="url(#a)"/>

  <!-- people -->
  <rect x="765" y="383" width="150" height="40" rx="20" class="n" style="stroke:#58a6ff"/>
  <text x="840" y="408" class="t">Operator alerts</text>
  <line x1="700" y1="403" x2="763" y2="403" class="e d" marker-end="url(#a)"/>

  <rect x="755" y="630" width="170" height="50" rx="25" class="n" style="stroke:#58a6ff"/>
  <text x="840" y="651" class="t">Residents &amp;</text>
  <text x="840" y="667" class="t">building managers</text>
  <line x1="700" y1="655" x2="753" y2="655" class="e" marker-end="url(#a)"/>
  <path d="M544,675 V706 H840 V682" class="e" marker-end="url(#a)"/>
</svg>
